<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111119">
  <meta name="description" content="A pocket-sized arcade of single-player games. Pick a game and jump in.">
  <title>Pocket Cabinet · Arcade</title>
  <link rel="icon" href="./cabinet.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./arcade.css">
  <script type="module" src="./arcade.js"></script>
</head>
<body>
  <svg hidden xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z" fill="currentColor"/></symbol>
      <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="play" viewBox="0 0 24 24"><path d="M6 3.5v17L20 12z" fill="currentColor"/></symbol>
      <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="external" viewBox="0 0 24 24"><path d="M6 18 18 6M7 6h11v11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="controller" viewBox="0 0 24 24"><path d="M7.7 6h8.6c2.4 0 3.4 1.6 4 4.1l1.1 5.6c.6 3.3-2 4.2-3.8 2.3l-2.3-2.3H8.7L6.4 18c-1.8 1.9-4.4 1-3.8-2.3l1.1-5.6C4.3 7.6 5.3 6 7.7 6Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.7 8.8v4.4m-2.2-2.2h4.4" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="11.8" r="1" fill="currentColor"/><circle cx="17.4" cy="9.7" r="1" fill="currentColor"/></symbol>
      <symbol id="spark" viewBox="0 0 16 16"><path d="M7 0h2v4h2v2h2v1h3v2h-3v1h-2v2H9v4H7v-4H5v-2H3V9H0V7h3V6h2V4h2z" fill="currentColor"/></symbol>
    </defs>
  </svg>
  <a class="skip" href="#main">Skip to games</a>
  <header class="masthead">
    <div class="bar wrap">
      <a class="brand" href="./" aria-label="Pocket Cabinet home"><img src="./cabinet.svg" width="30" height="34" alt="">Pocket Cabinet</a>
      <nav aria-label="Main navigation">
        <a id="arcade-nav" href="./" aria-current="page"><svg aria-hidden="true"><use href="#grid"/></svg>Arcade</a>
        <a id="saved-nav" href="#saved" hidden><svg aria-hidden="true"><use href="#bookmark"/></svg>Saved</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    <!-- arcade:feature -->
    <section class="library" aria-labelledby="library-heading" id="library">
      <div class="library-head">
        <h2 id="library-heading">Game library</h2>
        <span class="rule" aria-hidden="true"></span>
        <span class="count" id="library-count"><!-- arcade:count --></span>
      </div>
      <div class="game-list"><!-- arcade:games --></div>
      <div id="saved-empty" class="empty" hidden>
        <svg aria-hidden="true"><use href="#bookmark"/></svg>
        <h3>No saved games yet</h3>
        <p>Use the bookmark on a game to keep it here.</p>
        <a href="./" class="back-arcade">Explore the arcade <span aria-hidden="true">→</span></a>
      </div>
    </section>
    <span id="announcement" class="visually-hidden" role="status"></span>
  </main>
  <footer class="wrap">
    <div class="signature"><img src="./cabinet.svg" alt="" width="18" height="20">Pocket Cabinet</div>
    <a href="https://github.com/maccam912/mini-games">View on GitHub <svg aria-hidden="true"><use href="#external"/></svg></a>
  </footer>
</body>
</html>
